table{width:100%;border-collapse:collapse;font-size:10px;background:#fff}
th,td{padding:6px;text-align:left;border-bottom:1px solid #f1f5f9}
th{color:#0d8a4e;font-weight:800;background:#f0fdf4}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs .btn{padding:7px 10px;font-size:10px}
.rt{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:3px 8px;border-radius:7px;font-weight:900;font-size:11px;display:inline-block}
.rt.hi{background:linear-gradient(135deg,#f59e0b,#d97706)}
.rt.mid{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.post{background:#fff;border-left:4px solid #10b981;padding:10px 12px;border-radius:10px;margin:6px 0;font-size:11px}

for(var i=0;i<all.length;i++)if(all[i][0]!==st.name)opps.push(all[i]);

if(!mOppSq.length){mOppSq=[];for(var k=0;k<5;k++)mOppSq.push(["Игрок "+(k+1),70+rnd(15)])}
var sum=0;for(var j=0;j<mLine.length;j++)sum+=st.players[mLine[j]].rating;

mMin=1;mMy=0;mTh=0;mPause=false;
for(var s=0;s<st.players.length;s++){st.players[s]._preG=st.players[s].goals||0;st.players[s]._preA=st.players[s].assists||0}

function tick(){
if(mPause)return;
mMin++;document.getElementById('mMin').textContent=mMin+"'";
var ratio=mMyStr/mOppStr;
var myChance=0.007*Math.min(ratio,1.7);var opChance=0.007*Math.min(1/ratio,1.7);
if(mMy>=4)myChance*=0.3;if(mTh>=4)opChance*=0.3;
if(Math.random()<myChance){var cands=[];for(var i=0;i<mLine.length;i++){var pl=st.players[mLine[i]];if(!GKSET[pl.name])cands.push(pl)}
var p=cands.length?cands[rnd(cands.length)]:st.players[mLine[0]];
if(p&&!GKSET[p.name]){p.goals++;mMy++;document.getElementById('mScore').textContent=mMy+' — '+mTh;
addEv('g','⚽ ГОЛ! '+p.name+" "+mMin+"'")}}
if(Math.random()<opChance){mTh++;document.getElementById('mScore').textContent=mMy+' — '+mTh;
var opC=[];for(var k=0;k<mOppSq.length;k++)if(!GKSET[mOppSq[k][0]])opC.push(mOppSq[k]);
var op=opC.length?opC[rnd(opC.length)]:mOppSq[0];
addEv('o','⚽ Гол! '+op[0]+' ('+mOpp+') '+mMin+"'")}
if(mMin===45){mPause=true;addEv('i','⏸ Перерыв '+mMy+' — '+mTh);
document.getElementById('mActions').innerHTML='<button class="btn" onclick="contM()">▶ 2-й тайм</button>';return}
if(mMin>=90){endM();return}
timer=setTimeout(tick,80+rnd(120))}

addEv('i','🏁 Матч окончен: '+mMy+' — '+mTh);
st.week++;st.goals+=mMy;st.conc+=mTh;
var inc=(st.ticketPrice*5000)/1000000;st.budget+=Math.round(inc*10)/10;
for(var i=0;i<tbl.length;i++){var r=tbl[i];
if(r.name===st.name){r.p++;r.gf+=mMy;r.ga+=mTh;if(mMy>mTh){r.w++;r.pts+=3}else if(mMy===mTh){r.d++;r.pts++}else{r.l++}}
else if(r.name===mOpp){r.p++;r.gf+=mTh;r.ga+=mMy;if(mTh>mMy){r.w++;r.pts+=3}else if(mTh===mMy){r.d++;r.pts++}else{r.l++}}
else{var a=rnd(4),b=rnd(4);r.p++;r.gf+=a;r.ga+=b;if(a>b){r.w++;r.pts+=3}else if(a===b){r.d++;r.pts++}else{r.l++}}}
for(var s=0;s<st.players.length;s++){var mp=st.players[s];
var onField=false;for(var j=0;j<mLine.length;j++)if(mLine[j]===s)onField=true;
if(!mp.history)mp.history=[];
if(onField){var dG=(mp.goals||0)-(mp._preG||0);var dA=(mp.assists||0)-(mp._preA||0);
var rating=6.0+(mp.rating-75)/15+dG*1.0+dA*0.5+(Math.random()*0.8-0.4);
if(mMy>mTh)rating+=0.3;else if(mMy<mTh)rating-=0.3;
if(rating<3.5)rating=3.5;if(rating>10)rating=10;
mp.history.push({week:st.week,opp:mOpp,rating:rating,goals:dG,assists:dA})}
if(mp.goals>0){var found=false;
for(var kk=0;kk<scorers.length;kk++)if(scorers[kk].name===mp.name&&scorers[kk].club===st.name){found=true;break}
if(!found)scorers.push({name:mp.name,club:st.name,goals:mp.goals,rating:mp.rating});
else for(var kk2=0;kk2<scorers.length;kk2++)if(scorers[kk2].name===mp.name&&scorers[kk2].club===st.name){scorers[kk2].goals=mp.goals;break}}}
for(var k=0;k<12;k++){var sc=scorers[rnd(scorers.length)];
if(sc&&sc.club!==st.name&&sc.rating>=78)sc.goals++}
if(mMy>mTh){st.trust=Math.min(100,st.trust+3);st.budget+=2;pushPost("@SportsDaily","✅ "+st.name+" обыграл "+mOpp+" "+mMy+":"+mTh,false)}
else if(mMy<mTh){st.trust=Math.max(0,st.trust-4);pushPost("@PressZone","❌ "+st.name+" уступил "+mOpp+" "+mTh+":"+mMy,true)}
else pushPost("@SportsDaily","➖ "+st.name+" — "+mOpp+" "+mMy+":"+mTh,false);
genPosts(2+rnd(2));
setTimeout(function(){if(mMy>mTh)sWin();else if(mMy<mTh)sLose();else sEnd()},150);

function getMyCoachPts(){

pts+=(st.trust-50); // доверие — основа
// За трофеи
if(st.trophies)for(var i=0;i<st.trophies.length;i++){
var t=st.trophies[i].name;
if(t==='Лига Чемпионов')pts+=50;
else if(t.indexOf('Кубок')>-1)pts+=20;
else pts+=15}
// За место в лиге
if(tbl){
var sorted=tbl.slice().sort(function(a,b){return b.pts-a.pts});
for(var j=0;j<sorted.length;j++)if(sorted[j].name===st.name){
if(j===0)pts+=30;
else if(j<=2)pts+=20;
else if(j<=4)pts+=10;
else if(j>=sorted.length-3)pts-=15;
break}}
return Math.max(0,pts)}

function drawField(){
var canvas=document.getElementById('tacCanvas');
if(!canvas)return;
var ctx=canvas.getContext('2d');
var W=canvas.width;var H=canvas.height;
// Поле
ctx.fillStyle='#15803d';
ctx.fillRect(0,0,W,H);
// Полосы
ctx.fillStyle='#166534';
for(var i=0;i<8;i++)if(i%2===0)ctx.fillRect(0,i*H/8,W,H/8);
// Разметка
ctx.strokeStyle='#fff';ctx.lineWidth=2;
ctx.strokeRect(10,10,W-20,H-20);
ctx.beginPath();ctx.moveTo(W/2,10);ctx.lineTo(W/2,H-10);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H/2,40,0,Math.PI*2);ctx.stroke();
// Штрафные
ctx.strokeRect(10,H/2-60,60,120);
ctx.strokeRect(W-70,H/2-60,60,120);
// Ворота
ctx.fillStyle='#fff';
ctx.fillRect(2,H/2-30,8,60);
ctx.fillRect(W-10,H/2-30,8,60);
// Расстановка игроков по схеме
var form=FORMS[st.form]||FORMS['4-3-3'];
var players=form.length;
// Разделяем на линии: GK, DF, MF, FW
var lines={GK:[],DF:[],MF:[],FW:[]};
for(var p=0;p<form.length;p++)lines[form[p]].push(p);
// Позиции Y (сверху вниз = от своих ворот к чужим)
var y=H-40;
// Вратарь
if(lines.GK.length){
ctx.fillStyle='#fbbf24';
ctx.beginPath();ctx.arc(W/2,y,16,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#000';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
ctx.fillText('ВР',W/2,y+4)}
// Защитники
y=H-110;
for(var d=0;d<lines.DF.length;d++){
var x=(W/(lines.DF.length+1))*(d+1);
var idx=lines.DF[d];
drawPlayerDot(ctx,x,y,'#3b82f6',form[idx]);
}
// Полузащитники
y=H/2+10;
for(var m=0;m<lines.MF.length;m++){
var x2=(W/(lines.MF.length+1))*(m+1);
var idx2=lines.MF[m];
drawPlayerDot(ctx,x2,y,'#10b981',form[idx2]);
}
// Нападающие
y=70;
for(var f=0;f<lines.FW.length;f++){
var x3=(W/(lines.FW.length+1))*(f+1);
var idx3=lines.FW[f];
drawPlayerDot(ctx,x3,y,'#ef4444',form[idx3]);
}
// Легенда
ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,20);
ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='left';
ctx.fillText('🟡 ВР  🔵 ЗАЩ  🟢 ПОЛ  🔴 НАП',8,14);}

function drawPlayerDot(ctx,x,y,color,label){

ctx.fillStyle=color;
ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill();
// Обводка
ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
// Текст
ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
ctx.fillText(label,x,y+3)}

function drawLiveField(){
var canvas=document.getElementById('liveCanvas');
if(!canvas)return;
var ctx=canvas.getContext('2d');
var W=canvas.width;var H=canvas.height;
// Поле
ctx.fillStyle='#15803d';
ctx.fillRect(0,0,W,H);
ctx.fillStyle='#166534';
for(var i=0;i<8;i++)if(i%2===0)ctx.fillRect(0,i*H/8,W,H/8);
// Разметка
ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
ctx.strokeRect(10,10,W-20,H-20);
ctx.beginPath();ctx.moveTo(W/2,10);ctx.lineTo(W/2,H-10);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H/2,35,0,Math.PI*2);ctx.stroke();
// Ворота
ctx.fillStyle='rgba(255,255,255,.8)';
ctx.fillRect(2,H/2-25,8,50);
ctx.fillRect(W-10,H/2-25,8,50);
// Мои игроки (синие) — двигаются
var form=FORMS[st.form]||FORMS['4-3-3'];
var t=Date.now()/300;
for(var i=0;i<form.length;i++){
var baseX=(i+1)*W/(form.length+1);
var baseY=H-60;
// Легкое движение
var x=baseX+Math.sin(t+i)*15;
var y=baseY+Math.cos(t+i*1.3)*10;
ctx.fillStyle='#3b82f6';
ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
// Номер
ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
ctx.fillText(i+1,x,y+3)}
// Соперник (красные)
for(var j=0;j<11;j++){
var baseX2=(j+1)*W/12;
var baseY2=60;
var x2=baseX2+Math.sin(t+j*1.1)*15;
var y2=baseY2+Math.cos(t+j*0.9)*10;
ctx.fillStyle='#ef4444';
ctx.beginPath();ctx.arc(x2,y2,10,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
ctx.fillText(j+1,x2,y2+3)}
// Мяч
ball.x+=ball.vx;ball.y+=ball.vy;
if(ball.x<15||ball.x>W-15)ball.vx*=-1;
if(ball.y<15||ball.y>H-15)ball.vy*=-1;
if(Math.random()<0.05){ball.vx=(Math.random()-0.5)*4;ball.vy=(Math.random()-0.5)*4}
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(ball.x,ball.y,5,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
// Минута сверху
ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,22);
ctx.fillStyle='#34d399';ctx.font='bold 13px sans-serif';ctx.textAlign='left';
ctx.fillText('⚽ '+mMin+"'",8,16);
ctx.fillStyle='#fff';ctx.textAlign='right';
ctx.fillText(mMy+' — '+mTh,W-8,16);
ctx.fillStyle='#94a3b8';ctx.textAlign='center';
ctx.fillText(st.name.substring(0,12)+' vs '+mOpp.substring(0,12),W/2,16)}
