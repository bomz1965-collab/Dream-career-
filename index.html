body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,#e8edf3 0%,#dde4ed 100%);color:#1a2233;padding:12px;font-size:13px;min-height:100vh}
#app{max-width:520px;margin:0 auto}
h2{color:#0d8a4e;font-size:17px;margin:8px 0;font-weight:800}
h3{color:#0d8a4e;font-size:14px;margin:6px 0;font-weight:700}

.btn:active{transform:scale(.97);box-shadow:0 1px 4px rgba(16,185,129,.3)}
.btn.full{width:100%}
.btn.sec{background:#fff;color:#4b5563;box-shadow:0 2px 6px rgba(0,0,0,.08);border:1px solid #d1d9e0}
.btn.sec:hover{background:#f7f9fc}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.red{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 3px 10px rgba(239,68,68,.28)}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 3px 10px rgba(245,158,11,.3)}
.screen{display:none;padding:4px}
.screen.on{display:block;animation:fi .25s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid #e2e8f0;padding:13px;border-radius:14px;margin:7px 0;box-shadow:0 2px 8px rgba(30,41,59,.06)}
.club{background:#fff;border:1px solid #e2e8f0;color:#1a2233;padding:11px 13px;border-radius:12px;font-size:12px;margin:4px 0;text-align:left;width:100%;cursor:pointer;transition:.15s;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(30,41,59,.04)}
.club:hover{border-color:#10b981;transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.15)}
.club.sel{background:linear-gradient(135deg,#10b981,#059669);border-color:#0d8a4e;color:#fff}
.club .nm{font-weight:800;font-size:13px}
.club .mt{font-size:10px;color:#0d8a4e;margin-top:2px;font-weight:600}
.club.sel .mt{color:#dcfce7}
.big{font-size:24px;font-weight:900;text-align:center;margin:6px 0;color:#1a2233;letter-spacing:-.5px}
.min{font-size:36px;font-weight:900;text-align:center;color:#10b981;font-family:'SF Mono',Consolas,monospace;text-shadow:0 2px 12px rgba(16,185,129,.35);letter-spacing:-1px}
.ev{padding:8px 10px;border-radius:9px;margin:4px 0;font-size:11px;background:#f7f9fc;font-weight:500;border:1px solid #e2e8f0}
.ev.g{border-left:4px solid #10b981;background:linear-gradient(90deg,rgba(16,185,129,.1),#f7f9fc);font-weight:700}
.ev.o{border-left:4px solid #ef4444;background:linear-gradient(90deg,rgba(239,68,68,.1),#f7f9fc);font-weight:700}
.ev.i{border-left:4px solid #3b82f6;color:#6b7280}
.pr{display:flex;justify-content:space-between;padding:9px 11px;border-bottom:1px solid #f1f5f9;background:#fff;border-radius:10px;margin:3px 0;font-size:11px;align-items:center;gap:8px;border:1px solid #e2e8f0}
.pr:last-child{border-bottom:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;font-size:10px;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:6px;text-align:left;border-bottom:1px solid #f1f5f9}
th{color:#0d8a4e;font-weight:800;background:#f0fdf4;font-size:9px;text-transform:uppercase;letter-spacing:.3px}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs .btn{padding:7px 10px;font-size:10px}
.rt{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:3px 8px;border-radius:7px;font-weight:900;font-size:11px;display:inline-block;min-width:30px;text-align:center}
.rt.hi{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.rt.mid{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.post{background:#fff;border-left:4px solid #10b981;padding:10px 12px;border-radius:10px;margin:6px 0;font-size:11px;box-shadow:0 1px 4px rgba(30,41,59,.06);border:1px solid #e2e8f0}
.post .meta{color:#0d8a4e;font-size:10px;font-weight:800;margin-bottom:4px}
.post.neg{border-left-color:#ef4444}
.post.neg .meta{color:#dc2626}
.post.cl{border-left-color:#f59e0b;background:linear-gradient(90deg,rgba(245,158,11,.08),#fff)}
.post.cl .meta{color:#b45309}
.trophy{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#422006;padding:16px;border-radius:14px;margin:7px 0;text-align:center;font-weight:800;box-shadow:0 6px 20px rgba(245,158,11,.35);font-size:13px}
.q{font-style:italic;color:#4b5563;font-size:13px;line-height:1.5}
.tag{display:inline-block;background:#ecfdf5;color:#0d8a4e;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-left:4px;border:1px solid #a7f3d0}
.tag.gray{background:#f1f5f9;color:#6b7280;border-color:#e2e8f0}
</style>

var price=st.negPrice;var sal=st.negSalary;var role=st.negRole;var can=price<=st.budget;
var h='<div class="card"><b>'+p.name+'</b><br>'+p.club+' · '+p.age+' лет · Рейтинг '+p.rating+'</div>';
h+='<div class="card"><b>💰 Предложение</b><br>Сейчас: €<b style="color:#d97706">'+price+'M</b><br>Бюджет: €'+st.budget+'M<br><br>';
h+='<button class="btn" onclick="negPrice(-10)">−10</button><button class="btn" onclick="negPrice(-5)">−5</button>';
h+='<button class="btn" onclick="negPrice(5)">+5</button><button class="btn" onclick="negPrice(10)">+10</button></div>';
h+='<div class="card"><b>💵 Зарплата: €'+sal+'K</b><br><br>';
h+='<button class="btn '+(role==='резерв'?'':'sec')+'" onclick="negRole(\'резерв\')">Резерв</button>';
h+='<button class="btn '+(role==='ротация'?'':'sec')+'" onclick="negRole(\'ротация\')">Ротация</button>';
h+='<button class="btn '+(role==='основной'?'':'sec')+'" onclick="negRole(\'основной\')">Основной</button></div>';
if(!can)h+='<div class="card" style="color:#dc2626;text-align:center;font-weight:700">Не хватает €'+(price-st.budget)+'M</div>';
h+='<div style="text-align:center;margin-top:10px"><button class="btn full" '+(!can?'disabled':'')+' onclick="submitNeg()">📨 Отправить предложение</button>';
h+='<button class="btn sec full" onclick="show(\'s-hub\')">Отмена</button></div>';
b.innerHTML=h}

function negPrice(d){st.negPrice+=d;if(st.negPrice<5)st.negPrice=5;renderNeg()}
function negRole(r){st.negRole=r;renderNeg()}

function submitNeg(){var p=world[st.negIdx];
if(RIV[st.name]&&RIV[st.name].indexOf(p.club)>-1){alert("❌ "+p.club+" не продаёт игроков в "+st.name);show('s-hub');return}
var base=calcPrice(p);var pm=st.negPrice/base;var chn=60;
if(lgOf(p.club)===lgOf(st.name))chn-=20;if(p.rating>=89)chn-=15;
var sal=st.negSalary;var role=st.negRole;
if(pm>=1.3)chn+=20;else if(pm>=1.1)chn+=10;else if(pm<0.9)chn-=30;
if(role==='основной')chn+=10;else if(role==='резерв')chn-=15;
if(sal>=p.rating*4)chn+=10;else if(sal<p.rating*2)chn-=15;
if(chn<5)chn=5;if(chn>90)chn=90;
if(rnd(100)<chn){st.budget-=st.negPrice;st.players.push({name:p.name,rating:p.rating,age:p.age,goals:0});
scorers.push({name:p.name,club:st.name,goals:0,rating:p.rating});p.club=st.name;
pushPost("@TransferKing","✅ "+p.name+" переходит в "+st.name+" за €"+st.negPrice+"M!");
alert("✅ ТРАНСФЕР УДАЛСЯ!\nШанс был "+chn+"%.");show('s-hub');renderHub()}
else{pushPost("@TransferKing","❌ "+p.club+" отклонил предложение по "+p.name,true);
alert("❌ ОТКАЗ.\nШанс был "+chn+"%.");show('s-hub');renderHub()}}

function sellValue(p){var b=p.rating*p.rating*0.035;
if(GKSET[p.name])b*=0.35;
if(p.age>32)b*=0.4;else if(p.age>34)b*=0.2;else if(p.age<23)b*=1.3;
return Math.round(b)}

function sellMy(i){if(st.players.length<12){alert("Мало игроков в составе");return}
st.sellIdx=i;var p=st.players[i];var value=sellValue(p);
st.sellOffers=[];var num=1+rnd(3);
for(var k=0;k<num;k++){var fromClubs=[];
for(var lk in L)for(var c=0;c<L[lk].length;c++)if(L[lk][c][0]!==st.name)fromClubs.push(L[lk][c][0]);
var from=fromClubs[rnd(fromClubs.length)];
var isRich=RICH.indexOf(from)>-1;
var mult=isRich?(0.9+Math.random()*0.5):(0.3+Math.random()*0.35);
if(p.age>32)mult*=0.6;
st.sellOffers.push({club:from,price:Math.round(value*mult)})}
renderSell();show('s-sell')}

function renderSell(){var p=st.players[st.sellIdx];
var h='<div class="card"><b>'+p.name+'</b> · '+p.rating+' · '+p.age+' лет</div>';
h+='<div class="card"><b>Предложения клубов:</b>';
if(!st.sellOffers.length)h+='<div style="color:#6b7280">Нет предложений</div>';
for(var i=0;i<st.sellOffers.length;i++){var o=st.sellOffers[i];
h+='<div class="pr"><div><b>'+o.club+'</b></div><div style="color:#d97706;font-weight:800">€'+o.price+'M</div><button class="btn" onclick="acceptSell('+i+')">Принять</button></div>'}
h+='</div><div style="text-align:center"><button class="btn sec full" onclick="show(\'s-hub\')">Отмена</button></div>';
document.getElementById('sellBody').innerHTML=h}

function acceptSell(oi){var o=st.sellOffers[oi];var p=st.players[st.sellIdx];
st.budget+=o.price;
pushPost("@TransferKing","💸 "+st.name+" продал "+p.name+" в "+o.club+" за €"+o.price+"M");
st.players.splice(st.sellIdx,1);
for(var i=0;i<scorers.length;i++)if(scorers[i].name===p.name&&scorers[i].club===st.name){scorers.splice(i,1);break}
alert("✅ Продано! "+p.name+" → "+o.club+" за €"+o.price+"M");
show('s-hub');renderHub()}
  function autoLine(){var arr=[];for(var i=0;i<st.players.length;i++)arr.push({i:i,r:st.players[i].rating});
arr.sort(function(a,b){return b.r-a.r});mLine=[];for(var j=0;j<Math.min(11,arr.length);j++)mLine.push(arr[j].i)}

function startM(){autoLine();var all=L[curLg];var opps=[];
for(var i=0;i<all.length;i++)if(all[i][0]!==st.name)opps.push(all[i]);
if(!st.oppIdx)st.oppIdx=0;
var opp=opps[st.oppIdx%opps.length];st.oppIdx++;
mOpp=opp[0];mOppStr=opp[1];mOppSq=SQ[mOpp]||[];
if(!mOppSq.length){mOppSq=[];for(var k=0;k<5;k++)mOppSq.push(["Игрок "+(k+1),70+rnd(15)])}
var sum=0;for(var j=0;j<mLine.length;j++)sum+=st.players[mLine[j]].rating;
mMyStr=mLine.length?sum/mLine.length:70;
mMin=1;mMy=0;mTh=0;mPause=false;window._cup=false;
document.getElementById('mTeams').textContent=st.name+' vs '+mOpp;
document.getElementById('mScore').textContent='0 — 0';document.getElementById('mMin').textContent="1'";
document.getElementById('mEvents').innerHTML='<div class="ev i">⚽ Матч начался!</div>';
document.getElementById('mActions').innerHTML='';show('s-match');tick()}

function tick(){if(mPause)return;mMin++;document.getElementById('mMin').textContent=mMin+"'";
var ratio=mMyStr/mOppStr;
var myChance=0.007*Math.min(ratio,1.7);var opChance=0.007*Math.min(1/ratio,1.7);
if(mMy>=4)myChance*=0.3;if(mTh>=4)opChance*=0.3;
if(Math.random()<myChance){var cands=[];for(var i=0;i<mLine.length;i++){var pl=st.players[mLine[i]];if(!GKSET[pl.name])cands.push(pl)}
var p=cands.length?cands[rnd(cands.length)]:st.players[mLine[0]];
if(p&&!GKSET[p.name]){p.goals++;mMy++;document.getElementById('mScore').textContent=mMy+' — '+mTh;
addEv('g','⚽ ГОЛ! '+p.name+" "+mMin+"'")}}
if(Math.random()<opChance){mTh++;document.getElementById('mScore').textContent=mMy+' — '+mTh;
var opCands=[];for(var k=0;k<mOppSq.length;k++){if(!GKSET[mOppSq[k][0]])opCands.push(mOppSq[k])}
var op=opCands.length?opCands[rnd(opCands.length)]:mOppSq[0];
addEv('o','⚽ Гол! '+op[0]+' ('+mOpp+') '+mMin+"'")}
if(mMin===45){mPause=true;addEv('i','⏸ Перерыв '+mMy+' — '+mTh);
document.getElementById('mActions').innerHTML='<button class="btn" onclick="contM()">▶ 2-й тайм</button>';return}
if(mMin>=90){endM();return}timer=setTimeout(tick,80+rnd(120))}

function contM(){mPause=false;document.getElementById('mActions').innerHTML='';addEv('i','▶ 2-й тайм');tick()}
function addEv(c,t){var d=document.createElement('div');d.className='ev '+c;d.textContent=t;var e=document.getElementById('mEvents');e.insertBefore(d,e.firstChild)}

function endM(){clearTimeout(timer);addEv('i','🏁 Матч окончен: '+mMy+' — '+mTh);
if(window._cup){window._cup=false;afterCupMatch();return}
st.week++;st.goals+=mMy;st.conc+=mTh;
var income=(st.ticketPrice*5000)/1000000;st.budget+=Math.round(income*10)/10;
for(var i=0;i<tbl.length;i++){var r=tbl[i];
if(r.name===st.name){r.p++;r.gf+=mMy;r.ga+=mTh;if(mMy>mTh){r.w++;r.pts+=3}else if(mMy===mTh){r.d++;r.pts++}else{r.l++}}
else if(r.name===mOpp){r.p++;r.gf+=mTh;r.ga+=mMy;if(mTh>mMy){r.w++;r.pts+=3}else if(mTh===mMy){r.d++;r.pts++}else{r.l++}}
else{var a=rnd(4),b=rnd(4);r.p++;r.gf+=a;r.ga+=b;if(a>b){r.w++;r.pts+=3}else if(a===b){r.d++;r.pts++}else{r.l++}}}
for(var s=0;s<st.players.length;s++){var mp=st.players[s];
if(mp.goals>0){var found=false;
for(var kk=0;kk<scorers.length;kk++){if(scorers[kk].name===mp.name&&scorers[kk].club===st.name){found=true;break}}
if(!found)scorers.push({name:mp.name,club:st.name,goals:mp.goals,rating:mp.rating});
else for(var kk2=0;kk2<scorers.length;kk2++)if(scorers[kk2].name===mp.name&&scorers[kk2].club===st.name){scorers[kk2].goals=mp.goals;break}}}
for(var k=0;k<12;k++){var sc=scorers[rnd(scorers.length)];
if(sc&&sc.club!==st.name&&sc.rating>=78)sc.goals++}
if(mMy>mTh){st.trust=Math.min(100,st.trust+3);st.budget+=2;pushPost("@SportsDaily","✅ "+st.name+" обыграл "+mOpp+" "+mMy+":"+mTh,false)}
else if(mMy<mTh){st.trust=Math.max(0,st.trust-4);pushPost("@PressZone","❌ "+st.name+" уступил "+mOpp+" "+mTh+":"+mMy,true)}
else pushPost("@SportsDaily","➖ "+st.name+" — "+mOpp+" "+mMy+":"+mTh,false);
genPosts(2+rnd(2));
document.getElementById('mActions').innerHTML='<button class="btn full" onclick="backH()">← В хаб</button>'}

function backH(){clearTimeout(timer);renderHub();show('s-hub')}

// ЕВРОКУБОК
function startCup(){
if(!mCup){alert("Клуб не участвует в еврокубках");return}
if(!st.cup){
var pool=[];
for(var lk in L)for(var c=0;c<L[lk].length;c++){
if(L[lk][c][0]!==st.name&&cupOf(L[lk][c][1])===mCup)pool.push({name:L[lk][c][0],str:L[lk][c][1],league:lk})}
pool.sort(function(a,b){return b.str-a.str});
var opps=[];var myLgCount=0;
for(var i=0;i<pool.length&&opps.length<8;i++){
var p=pool[i];
if(p.league===curLg){if(myLgCount>=1)continue;myLgCount++}
opps.push(p)}
while(opps.length<8&&pool.length>opps.length){var p2=pool[rnd(pool.length)];var has=false;
for(var j=0;j<opps.length;j++)if(opps[j].name===p2.name)has=true;
if(!has)opps.push(p2)}
st.cup={stage:'group',round:0,opps:opps.slice(0,8),pts:0,bracket:[],finalRank:0,koStage:'',champion:false};
pushPost("@ChampionsLeague","🏆 "+st.name+" узнал соперников в "+mCup+"!",false,true)}
if(st.cup.stage==='group'&&st.cup.round>=8){finishGroup();return}
if(st.cup.stage==='ko'){renderCupView();return}
var opp=st.cup.opps[st.cup.round];
playCupMatch(opp)}

function playCupMatch(opp){
autoLine();
mOpp=opp.name;mOppStr=opp.str;mOppSq=SQ[opp.name]||[];
if(!mOppSq.length){mOppSq=[];for(var k=0;k<5;k++)mOppSq.push(["Игрок "+(k+1),70+rnd(15)])}
var sum=0;for(var j=0;j<mLine.length;j++)sum+=st.players[mLine[j]].rating;
mMyStr=mLine.length?sum/mLine.length:70;
mMin=1;mMy=0;mTh=0;mPause=false;window._cup=true;
document.getElementById('mTeams').textContent=st.name+' vs '+mOpp+' · '+mCup;
document.getElementById('mScore').textContent='0 — 0';document.getElementById('mMin').textContent="1'";
document.getElementById('mEvents').innerHTML='<div class="ev i">🏆 '+mCup+' · матч '+(st.cup?st.cup.round+1:1)+'</div>';
document.getElementById('mActions').innerHTML='';show('s-match');tick()}

function afterCupMatch(){var c=st.cup;var won=mMy>mTh;
if(c.stage==='group'){
if(won)c.pts+=3;else if(mMy===mTh)c.pts+=1;
c.round++;
if(c.round>=8){finishGroup();return}
renderHub()}
else if(c.stage==='ko'){
if(!won){c.stage='done';c.champion=false;
pushPost("@ChampionsLeague","❌ "+st.name+" вылетел из "+mCup,true,true);renderHub();return}
if(c.koStage==='r16')c.koStage='qf';
else if(c.koStage==='qf')c.koStage='sf';
else if(c.koStage==='sf')c.koStage='final';
else if(c.koStage==='final'){
c.stage='done';c.champion=true;
st.trophies.push({name:mCup,season:1});
var prize=mCup==="Лига Чемпионов"?30:15;st.budget+=prize;
pushPost("@ChampionsLeague","🏆🏆 "+st.name+" ВЫИГРАЛ "+mCup+"!!! +€"+prize+"M",false,true);
alert("🏆🏆🏆 ПОБЕДА В "+mCup.toUpperCase()+"!!!\nПризовые: €"+prize+"M");
renderHub();return}
var pool=[];
for(var lk in L)for(var cc=0;cc<L[lk].length;cc++){
if(L[lk][cc][0]!==st.name&&cupOf(L[lk][cc][1])===mCup)pool.push({name:L[lk][cc][0],str:L[lk][cc][1]})}
pool.sort(function(a,b){return b.str-a.str});
var idx=0;
if(c.koStage==='qf')idx=Math.floor(pool.length/4);
else if(c.koStage==='sf')idx=Math.floor(pool.length/3);
else idx=Math.floor(pool.length/4);
var next=pool[idx+rnd(3)]||pool[0];
c.bracket.push(next);
pushPost("@ChampionsLeague","✅ "+st.name+" прошёл! Соперник: "+next.name,false,true);
renderHub()}}

function finishGroup(){var c=st.cup;
var teamTable=[{name:st.name,pts:c.pts}];
for(var i=0;i<c.opps.length;i++){var o=c.opps[i];teamTable.push({name:o.name,pts:rnd(4)})}
teamTable.sort(function(a,b){return b.pts-a.pts});
for(var j=0;j<teamTable.length;j++)if(teamTable[j].name===st.name){c.finalRank=j+1;break}
if(c.finalRank<=8)c.koStage='r16';
else if(c.finalRank<=16)c.koStage='playoff';
else c.koStage='out';
c.stage='ko';
pushPost("@ChampionsLeague","📊 "+st.name+" финишировал на "+c.finalRank+" месте в группе! Очки: "+c.pts,false,true);
if(c.koStage==='r16'){
var pool=[];
for(var lk in L)for(var cc=0;cc<L[lk].length;cc++){
if(L[lk][cc][0]!==st.name&&cupOf(L[lk][cc][1])===mCup)pool.push({name:L[lk][cc][0],str:L[lk][cc][1]})}
pool.sort(function(a,b){return b.str-a.str});
var idx=Math.floor(pool.length*0.66);
c.bracket.push(pool[idx+rnd(3)]||pool[pool.length-1])}
else if(c.koStage==='playoff'){
var pool2=[];
for(var lk2 in L)for(var cc2=0;cc2<L[lk2].length;cc2++){
if(L[lk2][cc2][0]!==st.name&&cupOf(L[lk2][cc2][1])===mCup)pool2.push({name:L[lk2][cc2][0],str:L[lk2][cc2][1]})}
pool2.sort(function(a,b){return b.str-a.str});
c.bracket.push(pool2[rnd(3)]||pool2[0])}
renderHub()}

function playKO(){var c=st.cup;if(!c.bracket.length)return;
var opp=c.bracket[c.bracket.length-1];playCupMatch(opp)}

function renderCupView(){
var b=document.getElementById('hubView');var h='';
if(!mCup){h+='<div class="card" style="text-align:center;color:#6b7280">Клуб не участвует в еврокубках.<br>Нужен рейтинг 70+.</div>';b.innerHTML=h;return}
var c=st.cup;
h+='<div class="card" style="text-align:center"><b style="color:#b45309;font-size:15px">🏆 '+mCup+'</b></div>';
if(!c){h+='<div class="card" style="text-align:center">Готов начать групповой этап?<br><br><button class="btn" onclick="startCup()">▶ Начать еврокубок</button></div>';b.innerHTML=h;return}
if(c.stage==='group'){
h+='<div class="card">Тур '+(c.round+1)+'/8 · Очки: <b style="color:#0d8a4e">'+c.pts+'</b></div>';
h+='<div class="card">Соперники:';
for(var i=0;i<c.opps.length;i++){var o=c.opps[i];var done=i<c.round;
h+='<div class="pr"><div>'+(i+1)+'. '+o.name+' ('+o.str+')</div><div>'+(done?'✅':'⌛')+'</div></div>'}
h+='</div>';
if(c.round>=8)h+='<div style="text-align:center"><button class="btn" onclick="startCup()">▶ Завершить группу</button></div>';
else h+='<div style="text-align:center"><button class="btn" onclick="startCup()">▶ Матч группы</button></div>'}
else if(c.stage==='ko'&&c.koStage!=='out'){
h+='<div class="card">Место: <b>'+c.finalRank+'</b> · Стадия: <b style="color:#0d8a4e">'+(c.koStage==='r16'?'1/8':(c.koStage==='qf'?'1/4':(c.koStage==='sf'?'1/2':(c.koStage==='final'?'ФИНАЛ':'Стыковые'))))+'</b></div>';
if(c.bracket&&c.bracket.length){var cur=c.bracket[c.bracket.length-1];
h+='<div class="card">Соперник: <b>'+cur.name+'</b> ('+cur.str+')</div>'}
h+='<div style="text-align:center"><button class="btn" onclick="playKO()">▶ Играть</button></div>'}
else if(c.stage==='ko'&&c.koStage==='out'){h+='<div class="card" style="text-align:center">❌ Вылетел. Место '+c.finalRank+'</div>'}
else if(c.stage==='done'){h+='<div class="card" style="text-align:center;font-size:16px;font-weight:800">'+(c.champion?'🏆 ЧЕМПИОН '+mCup+'!':'Вылет')+'</div>'}
b.innerHTML=h}

function startIV(){var q=IVQ[rnd(IVQ.length)];
var h='<div class="card"><p class="q">'+q.q+'</p>';
for(var i=0;i<q.a.length;i++){var a=q.a[i];
h+='<button class="btn full" style="text-align:left;margin:5px 0" onclick="ansIV('+i+')">'+a.t+'</button>'}
h+='</div>';
document.getElementById('ivBody').innerHTML=h;window._ivQ=q;show('s-iv')}

function ansIV(i){var q=window._ivQ;var a=q.a[i];
st.trust=Math.max(0,Math.min(100,st.trust+a.tru));
st.fans=Math.max(0,Math.min(100,st.fans+a.fan));
pushPost("@PressZone","🎤 Тренер "+st.name+": «"+a.t+"»");
alert("Готово! Доверие: "+st.trust+"%, Фанаты: "+st.fans+"%");
show('s-hub');renderHub()}

show('s-menu');
</script>
</body>
